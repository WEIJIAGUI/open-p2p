shared:
  output_path: ${USER}/policy_model/delta_force_150M
  n_seq_timesteps: 200
  frame_height: 192
  frame_width: 192
  load_video_name: video.mp4
  text_tokenizer_config:
    text_tokenizer_name: "gemma"
    text_embedding_shape: [1, 768]
    text_annotation_model_version: ["gemini-2.5-flash", "gemini-2.5-flash-thinking-0905"]
  tokenizer:
    type: "conv"
    conv_tokenizer_config:
      num_tokens: 1

inference:
  mouse_sampling_approach: "truncated_normal"

policy_model:
  n_transformer_layers: 10
  n_q_head: 16
  n_kv_head: 16
  n_thinking_tokens: 1
  transformer_dim: &transformer_dim 1024
  mask_block_size: 128
  attention_history_len: [200, 200, 200, 200, 200, 200, 200, 200, 200, 200]
  n_kv_sink_tokens: 0
  model_type: "dense"
  action_decoder:
    embed_dim: *transformer_dim
  z_loss_weight: 0.0001
  top_p: 0.95

stage3_finetune:
  optim:
    learning_rate: 0.0001
    weight_decay: 0.0001
    beta_1: 0.9
    beta_2: 0.999

  validation_step_interval: 2_000_000
  n_validation_steps: &n_validation_steps 200
  save_every_n_steps: 5000
  n_training_steps: 200_000
  accumulate_grad_batches: 1

  training_dataset:
    batch_size: 1
    local_prefix: delta_force_data
    warn_on_starvation: false
    rand_augmentation:
      fraction_augmented: 1.0
      augmentations:
        - spatial_transform
        - color
        - planckian
        - iso_noise
        - translation
        - random_blur
        - sharpness
    n_preprocess_threads_per_gpu: 2
    preprocessed_chunks_queue_size_per_gpu: 4
    shuffle_buffer_size_per_gpu: 1900
    dataset_worker_num_workers_per_gpu: 2
    dataset_worker_prefetch_factor: 2
    shuffled_chunks_queue_size_per_gpu: 4

  validation_datasets:
    - batch_size: 1
      local_prefix: delta_force_data
      validation_name: "delta_force_val"
      n_preprocess_threads_per_gpu: 1
      preprocessed_chunks_queue_size_per_gpu: 1
      shuffled_chunks_queue_size_per_gpu: 1
      dataset_worker_prefetch_factor: 1
      warn_on_starvation: false

wandb:
  enabled: false
  project: "delta-force-p2p"
  exp_name: "delta-force-stage3"